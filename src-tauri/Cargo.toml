[package]
name = "r2dock"
description = "R2Dock: a desktop file manager for Cloudflare R2"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
name = "r2dock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
r2dock-core.workspace = true
r2dock-r2.workspace = true
r2dock-secrets.workspace = true
r2dock-transfer.workspace = true

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

chrono.workspace = true
directories.workspace = true
parking_lot.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ts-rs.workspace = true
uuid.workspace = true
http = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
r2dock-testkit = { path = "../crates/r2dock-testkit" }
tempfile.workspace = true

[features]
# Used by `tauri dev` / `tauri build`.
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
