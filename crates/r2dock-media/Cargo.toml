[package]
name = "r2dock-media"
description = "Audio and video compression planning for R2Dock: probing, classification, and the bitrate ladder"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
fs4.workspace = true
hex.workspace = true
process-wrap = { version = "10", default-features = false, features = ["tokio1", "job-object", "kill-on-drop", "process-group"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
symphonia = { version = "0.6", default-features = false, features = ["mp3", "aac", "alac", "flac", "pcm", "isomp4", "ogg", "wav", "aiff", "id3v2"] }
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-util.workspace = true
ts-rs.workspace = true
zstd = "0.13"

[dev-dependencies]
tokio = { workspace = true, features = ["process", "macros", "rt-multi-thread"] }

[lints]
workspace = true
