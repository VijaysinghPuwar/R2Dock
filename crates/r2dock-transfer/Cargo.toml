[package]
name = "r2dock-transfer"
description = "Transfer engine for R2Dock: streaming uploads and downloads with bounded concurrency"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
r2dock-core.workspace = true
r2dock-r2.workspace = true
r2dock-media.workspace = true
aws-sdk-s3.workspace = true
aws-smithy-types = { workspace = true, features = ["http-body-1-x"] }
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
fs4.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex.workspace = true
http-body = "1"
