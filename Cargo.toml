[workspace]
resolver = "3"
members = [
    "crates/r2dock-core",
    "crates/r2dock-secrets",
    "crates/r2dock-r2",
    "crates/r2dock-transfer",
    "crates/r2dock-testkit",
    "crates/r2dock-media",
    "src-tauri",
    
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
rust-version = "1.94"
repository = "https://github.com/VijaysinghPuwar/R2Dock"
authors = ["R2Dock contributors"]

[workspace.dependencies]
r2dock-core = { path = "crates/r2dock-core" }
r2dock-secrets = { path = "crates/r2dock-secrets" }
r2dock-r2 = { path = "crates/r2dock-r2" }
r2dock-transfer = { path = "crates/r2dock-transfer" }
r2dock-media = { path = "crates/r2dock-media" }

aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-smithy-types = { version = "1", features = ["rt-tokio"] }
aws-smithy-runtime-api = "1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
directories = "6"
fs4 = { version = "0.13", features = ["sync"] }
hex = "0.4"
md-5 = "0.10"
mime_guess = "2"
parking_lot = "0.12"
rand = "0.9"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings", "uuid-impl"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
zeroize = "1"

proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
