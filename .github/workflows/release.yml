name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (for example v0.4.0)
        required: true

permissions:
  contents: read

env:
  # The tag being released: the pushed tag, or the one given by hand.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Resolve the tag to one commit and check it matches every manifest, so all
  # jobs build and publish exactly the same tested revision.
  verify:
    name: Verify tag and versions
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Resolve the tag and check versions
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag $TAG is not vX.Y.Z"; exit 1; }
          v="${TAG#v}"
          sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
          [ "$sha" = "$(git rev-parse HEAD)" ] || { echo "Checkout does not match tag"; exit 1; }
          cargo_v="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          npm_v="$(node -p 'require("./package.json").version')"
          tauri_v="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          echo "tag=$v cargo=$cargo_v npm=$npm_v tauri=$tauri_v sha=$sha"
          [ "$cargo_v" = "$v" ] && [ "$npm_v" = "$v" ] && [ "$tauri_v" = "$v" ] || { echo "Version mismatch"; exit 1; }
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "CHANGELOG has no entry for $v"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            bundles: dmg
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            bundles: dmg
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
            bundles: nsis
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev libdbus-1-dev build-essential

      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the installer
        run: npm run tauri build -- ${{ matrix.args }} --bundles ${{ matrix.bundles }}

      # One clearly named file per platform (no MSI, RPM, or updater archives).
      - name: Collect and name the installers
        shell: bash
        run: |
          v="${TAG#v}"
          mkdir release-files
          case "${{ matrix.name }}" in
            "macOS Apple Silicon")
              cp target/aarch64-apple-darwin/release/bundle/dmg/*.dmg "release-files/R2Dock-$v-macOS-Apple-Silicon.dmg" ;;
            "macOS Intel")
              cp target/x86_64-apple-darwin/release/bundle/dmg/*.dmg "release-files/R2Dock-$v-macOS-Intel.dmg" ;;
            "Windows x64")
              cp target/release/bundle/nsis/*-setup.exe "release-files/R2Dock-$v-Windows-Setup.exe" ;;
            "Linux x64")
              cp target/release/bundle/appimage/*.AppImage "release-files/R2Dock-$v-Linux.AppImage"
              cp target/release/bundle/deb/*.deb "release-files/R2Dock-$v-Linux.deb" ;;
          esac
          ls -la release-files

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          path: release-files/*

  publish:
    name: Publish release
    needs: [verify, build]
    if: startsWith(inputs.tag || github.ref_name, 'v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Check the installer set
        shell: bash
        run: |
          set -euo pipefail
          v="${TAG#v}"
          expected="R2Dock-$v-Linux.AppImage R2Dock-$v-Linux.deb R2Dock-$v-Windows-Setup.exe R2Dock-$v-macOS-Apple-Silicon.dmg R2Dock-$v-macOS-Intel.dmg"
          actual="$(cd release-files && find . -type f | sed 's#^\./##' | LC_ALL=C sort | tr '\n' ' ' | sed 's/ $//')"
          [ "$actual" = "$expected" ] || { echo "Unexpected files: $actual"; exit 1; }
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${TAG#v}"
          cd release-files && sha256sum ./* | sed 's#  ./#  #' > SHA256SUMS.txt && cd ..
          {
            echo "## Which file do I download?"
            echo
            echo "| Your computer | File |"
            echo "|---|---|"
            echo "| Mac with Apple Silicon (M1, M2, M3, M4, M5) | \`R2Dock-$v-macOS-Apple-Silicon.dmg\` |"
            echo "| Mac with an Intel processor | \`R2Dock-$v-macOS-Intel.dmg\` |"
            echo "| Windows 10 or 11 | \`R2Dock-$v-Windows-Setup.exe\` |"
            echo "| Linux x64 with WebKitGTK 4.1 (most current distributions) | \`R2Dock-$v-Linux.AppImage\` |"
            echo "| Linux (Debian, Ubuntu) | \`R2Dock-$v-Linux.deb\` |"
            echo
            echo "Not sure which Mac you have? Apple menu > About This Mac: \"Chip: Apple M...\" means Apple Silicon; \"Processor: Intel\" means Intel."
            echo
            echo "Unsigned preview build. See the README for install notes on each platform. \`SHA256SUMS.txt\` lists the checksum of every file."
            echo
            awk -v ver="$v" '$0 ~ "^## \\[" ver "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md
          } > notes.md
          cat notes.md
          gh release create "$TAG" release-files/* --title "R2Dock $TAG" --notes-file notes.md --verify-tag
